version: "2"
linters:
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
    rules:
      # Pre-existing issues — tracked separately for future cleanup
      - linters: [errcheck]
        path: main\.go
      - linters: [staticcheck]
        text: "SA1019:"
      - linters: [staticcheck]
        text: "QF1001:"
      - linters: [staticcheck]
        text: "ST1006:"
      - linters: [unused]
        path: \.go$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
